<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Selected work</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=2">
</head>
<body>
  <header class="top">
    <div class="top__title">
      <a href="./" class="top__mark" title="사이트로">S</a>
      <div>
        <h1>Selected work <em>admin</em></h1>
        <p class="top__status" data-status>불러오는 중…</p>
      </div>
    </div>
    <div class="top__actions">
      <button class="btn btn--ghost" type="button" data-logout>잠그기</button>
      <a class="btn btn--ghost" href="./#work" target="_blank" rel="noopener">사이트 보기 ↗</a>
      <button class="btn btn--primary" type="button" data-publish disabled>게시하기</button>
    </div>
  </header>

  <!-- Password gate -->
  <div class="lock" data-lock>
    <form class="lock__card" data-login>
      <span class="top__mark">S</span>
      <h2>Selected work <em>admin</em></h2>
      <label>비밀번호
        <input type="password" data-password autocomplete="current-password" inputmode="numeric" required autofocus>
      </label>
      <p class="lock__error" data-login-error role="alert"></p>
      <button class="btn btn--primary" type="submit">들어가기</button>
      <a class="lock__back" href="./">← 사이트로 돌아가기</a>
    </form>
  </div>

  <main class="layout">
    <aside class="side">
      <div class="side__head">
        <span class="mono" data-count>0 projects</span>
        <button class="btn btn--small" type="button" data-add>+ 새 프로젝트</button>
      </div>
      <ol class="list" data-list></ol>
      <p class="side__hint">위에 있는 프로젝트가 사이트에서 먼저 나옵니다. ↑ ↓ 로 순서를 바꾸세요.</p>
    </aside>

    <section class="editor" data-editor>
      <div class="empty">왼쪽에서 프로젝트를 고르거나 <b>+ 새 프로젝트</b>를 누르세요.</div>
    </section>
  </main>

  <div class="toast" data-toast role="status" aria-live="polite"></div>

  <script src="data/projects.js?v=4"></script>
  <script src="js/admin.js?v=3"></script>
</body>
</html>
